# JM Comment: Define a cost-conscious Ray cluster managed by KubeRay.
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: ray-ai
  namespace: default
spec:
  rayVersion: "2.59.0"
  enableInTreeAutoscaling: true
  headGroupSpec:
    rayStartParams:
      dashboard-host: "0.0.0.0"
      num-cpus: "1"
    template:
      spec:
        nodeSelector:
          workload: system
        containers:
          - name: ray-head
            image: 145023571604.dkr.ecr.us-east-1.amazonaws.com/ray-ai-platform:v7
            env:
              - name: S3_BUCKET
                value: ray-ai-platform-145023571604
            ports:
              - containerPort: 6379
                name: gcs
              - containerPort: 8265
                name: dashboard
              - containerPort: 10001
                name: client
            resources:
              requests:
                cpu: "500m"
                memory: "1Gi"
              limits:
                cpu: "1"
                memory: "3Gi"
  workerGroupSpecs:
    - groupName: ray-workers
      replicas: 1
      minReplicas: 0
      maxReplicas: 3
      rayStartParams:
        num-cpus: "1"
      template:
        spec:
          nodeSelector:
            workload: ray-worker
          containers:
            - name: ray-worker
              image: 145023571604.dkr.ecr.us-east-1.amazonaws.com/ray-ai-platform:v7
              env:
                - name: S3_BUCKET
                  value: ray-ai-platform-145023571604
              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"
                limits:
                  cpu: "1"
                  memory: "2Gi"
