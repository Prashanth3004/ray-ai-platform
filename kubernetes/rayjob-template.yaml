
# JM Comment: Run the entity-resolution and model-training pipeline on KubeRay.
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: ray-ai-pipeline
  namespace: default
  labels:
    app: ray-ai-pipeline
    component: data-pipeline

spec:
  # JM Comment: Keep the job alive long enough for the pipeline to complete.
  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: 600

  entrypoint: python /workspace/app/ray_pipeline.py

  # JM Comment: Reuse the ECR image built and tagged by the Jenkins pipeline.
  runtimeEnvYAML: |
    env_vars:
      S3_BUCKET: "ray-ai-platform-145023571604"
      S3_PREFIX: "datasets"
      AWS_REGION: "us-east-1"

  rayClusterSpec:
    rayVersion: "2.59.0"

    headGroupSpec:
      # JM Comment: Keep the Ray head on the On-Demand system node pool.
      rayStartParams:
        dashboard-host: "0.0.0.0"
        num-cpus: "0"

      template:
        metadata:
          labels:
            app: ray-ai-pipeline
            ray-node-type: head
        spec:
          serviceAccountName: ray-ai
          nodeSelector:
            workload: system
          containers:
            - name: ray-head
              image: "${ECR_IMAGE}"
              imagePullPolicy: Always
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "500m"
                  memory: "1Gi"
              ports:
                - name: gcs
                  containerPort: 6379
                - name: dashboard
                  containerPort: 8265
                - name: client
                  containerPort: 10001

    # JM Comment: Schedule Ray workers on the Spot worker node pool.
    workerGroupSpecs:
      - groupName: ray-worker
        replicas: 1
        minReplicas: 0
        maxReplicas: 3
        rayStartParams: {}
        template:
          metadata:
            labels:
              app: ray-ai-pipeline
              ray-node-type: worker
          spec:
            serviceAccountName: ray-ai
            nodeSelector:
              workload: ray-worker
            containers:
              - name: ray-worker
                image: "${ECR_IMAGE}"
                imagePullPolicy: Always
                resources:
                  requests:
                    cpu: "500m"
                    memory: "1Gi"
                  limits:
                    cpu: "1"
                    memory: "2Gi"