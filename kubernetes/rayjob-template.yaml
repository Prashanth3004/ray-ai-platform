# JM Comment: Run the Ray pipeline in a dedicated Ray cluster for this CI build.
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: ray-ai-pipeline
  namespace: default
spec:
  entrypoint: "python /workspace/app/ray_pipeline.py"
  submissionMode: K8sJobMode
  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  rayClusterSpec:
    rayVersion: "2.59.0"
    headGroupSpec:
      rayStartParams:
        dashboard-host: "0.0.0.0"
        num-cpus: "1"
      template:
        spec:
          serviceAccountName: ray-ai
          nodeSelector:
            workload: system
          containers:
            - name: ray-head
              image: 145023571604.dkr.ecr.us-east-1.amazonaws.com/ray-ai-platform:${IMAGE_TAG}
              env:
                - name: S3_BUCKET
                  value: ray-ai-platform-145023571604
              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"
                limits:
                  cpu: "1"
                  memory: "3Gi"
    workerGroupSpecs:
      - groupName: ray-workers
        replicas: 1
        minReplicas: 0
        maxReplicas: 3
        rayStartParams:
          num-cpus: "1"
        template:
          spec:
            serviceAccountName: ray-ai
            nodeSelector:
              workload: ray-worker
            containers:
              - name: ray-worker
                image: 145023571604.dkr.ecr.us-east-1.amazonaws.com/ray-ai-platform:${IMAGE_TAG}
                env:
                  - name: S3_BUCKET
                    value: ray-ai-platform-145023571604
                resources:
                  requests:
                    cpu: "500m"
                    memory: "1Gi"
                  limits:
                    cpu: "1"
                    memory: "2Gi"
